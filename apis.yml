name: Sundae
description: 'Sundae is a residential real estate marketplace that buys homes directly from
  homeowners for cash and resells them to a vetted network of property investors. Sellers get a
  competitive as-is cash offer with no repairs, showings, or fees, flexible closings in as little
  as 10 days, and an optional cash advance before closing; investors access off-market and
  distressed properties through the Sundae Marketplace. Backed by QED Investors, Sundae operates a
  consumer-facing website, an investor marketplace, and an agent referral program. It is a
  proptech/fintech company and, as of this enrichment pass, publishes no public developer API,
  documentation, or SDK surface.'
